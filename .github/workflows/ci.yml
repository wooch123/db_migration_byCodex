name: Validate Claim Sync
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.lock
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: python -m pip wheel --no-deps . --wheel-dir dist
  launchers:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install from a clean environment (Linux)
        if: runner.os == 'Linux'
        run: ./run.sh --setup-only
        env:
          CLAIM_SYNC_NO_SYSTEM_INSTALL: "1"
      - name: Reuse installed packages without network (Linux)
        if: runner.os == 'Linux'
        run: ./run.sh --help
        env:
          PIP_NO_INDEX: "1"
      - name: Install from a clean environment (Windows)
        if: runner.os == 'Windows'
        run: .\run.bat --setup-only
        env:
          CLAIM_SYNC_NO_SYSTEM_INSTALL: "1"
      - name: Reuse installed packages without network (Windows)
        if: runner.os == 'Windows'
        run: .\run.bat --help
        env:
          PIP_NO_INDEX: "1"
      - name: Validate Windows launcher arguments and setup handling
        if: runner.os == 'Windows'
        run: |
          .\.venv\Scripts\python.exe -m pip install -r requirements-dev.lock
          .\.venv\Scripts\python.exe -m pytest -q tests/test_bootstrap.py
  compatible-mirror:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            launcher: .\run.bat
            python: ./.venv/Scripts/python.exe
          - os: ubuntu-latest
            launcher: ./run.sh
            python: ./.venv/bin/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare a restricted mirror without annotated-doc
        run: python -m pip download --only-binary=:all: -r tests/fixtures/compatible-mirror.txt --dest wheelhouse
      - name: Automatically resolve and verify older compatible versions
        run: ${{ matrix.launcher }} --setup-only
        env:
          CLAIM_SYNC_WHEELHOUSE: wheelhouse
          CLAIM_SYNC_NO_SYSTEM_INSTALL: "1"
      - name: Reuse selected versions without a package source
        run: ${{ matrix.launcher }} --help
        env:
          PIP_NO_INDEX: "1"
      - name: Install test tools without changing runtime versions
        run: ${{ matrix.python }} -m pip install "pytest>=8.3,<9" "pytest-asyncio>=0.26,<0.27"
      - name: Test the application with the older dependency set
        run: ${{ matrix.python }} -m pytest -q
