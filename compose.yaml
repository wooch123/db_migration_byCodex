services:
  web:
    build: .
    command: ["claim-sync", "web", "--host", "0.0.0.0"]
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      DATA_DIR: /app/data
      ENABLE_RUNNER: "false"
    volumes:
      - claim-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    build: .
    command: ["claim-sync", "worker"]
    env_file: .env
    environment:
      DATA_DIR: /app/data
    volumes:
      - claim-data:/app/data
    restart: unless-stopped
volumes:
  claim-data:
