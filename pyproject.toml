[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claim-sync"
version = "1.0.0"
description = "Claim enrichment and scheduled FAR synchronization"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<0.142", "uvicorn>=0.34,<0.53", "httpx>=0.28,<0.29",
  "pydantic>=2.7,<3", "pydantic-settings>=2.8,<3", "filelock>=3.18,<4", "tzdata>=2025.1"
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.26,<2", "ruff>=0.11,<1"]

[project.scripts]
claim-sync = "claim_sync.cli:main"

[tool.setuptools.packages.find]
include = ["claim_sync*"]

[tool.setuptools.package-data]
claim_sync = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
